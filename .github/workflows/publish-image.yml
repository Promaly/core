name: Publish image

# Called by `release.yml` right after semantic-release cuts a version — a tag
# pushed by that job's GITHUB_TOKEN does not itself trigger `on: push`, so the
# publish has to be invoked explicitly. Also runnable by hand for a manual tag.
on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to build and publish (e.g. v0.7.3)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish (e.g. v0.7.3)
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: promaly:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Run Trivy as a container from the AWS ECR public mirror — no GitHub-API
      # binary lookup and no Docker Hub pull, both of which are rate-limited and
      # made `aquasecurity/trivy-action` flaky here. Fails the release on an
      # unpatched CRITICAL/HIGH in the built image.
      - name: Scan image for vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
            -e TRIVY_DB_REPOSITORY=public.ecr.aws/aquasecurity/trivy-db \
            -e GITHUB_TOKEN='${{ github.token }}' \
            public.ecr.aws/aquasecurity/trivy:0.65.0 \
            image \
              --scanners vuln \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              promaly:release-candidate
      - id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/promaly/promaly:${{ env.TAG }}
            ghcr.io/promaly/promaly:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/promaly/promaly@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: promaly-${{ env.TAG }}.spdx.json
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/promaly/promaly@${{ steps.publish.outputs.digest }}
      - run: >-
          cosign attest --yes --type spdxjson
          --predicate promaly-${{ env.TAG }}.spdx.json
          ghcr.io/promaly/promaly@${{ steps.publish.outputs.digest }}
      - name: Attach SBOM to the semantic-release release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            if gh release view "${{ env.TAG }}" >/dev/null 2>&1; then
              gh release upload "${{ env.TAG }}" "promaly-${{ env.TAG }}.spdx.json" --clobber
              exit 0
            fi
            sleep 5
          done
          echo "no GitHub release for ${{ env.TAG }} to attach the SBOM to" >&2
          exit 1
