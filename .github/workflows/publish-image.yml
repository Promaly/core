name: Publish image

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: promaly:release-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: promaly:release-candidate
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/promaly/promaly:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/promaly/promaly@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: promaly-${{ github.ref_name }}.spdx.json
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/promaly/promaly@${{ steps.publish.outputs.digest }}
      - run: >-
          cosign attest --yes --type spdxjson
          --predicate promaly-${{ github.ref_name }}.spdx.json
          ghcr.io/promaly/promaly@${{ steps.publish.outputs.digest }}
      - name: Attach SBOM to the semantic-release release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              gh release upload "${{ github.ref_name }}" "promaly-${{ github.ref_name }}.spdx.json" --clobber
              exit 0
            fi
            sleep 5
          done
          echo "semantic-release did not create a GitHub release for ${{ github.ref_name }}" >&2
          exit 1
