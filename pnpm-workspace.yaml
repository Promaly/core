packages:
  - apps/*
  - packages/*
allowBuilds:
  argon2: true
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
# Force patched versions of transitive dependencies flagged by the image scan
# (all DoS-class). Direct dependencies are bumped in their own package.json.
overrides:
  tar@<7.5.22: '>=7.5.22'
  undici@<6.27.0: '>=6.27.0'
  ip-address@<10.3.1: '>=10.3.1'
  brace-expansion@<1.1.18: '>=1.1.18'
  brace-expansion@>=2.0.0 <2.1.4: '>=2.1.4'
  brace-expansion@>=3.0.0 <3.0.6: '>=3.0.6'
  brace-expansion@>=4.0.0 <5.0.9: '>=5.0.9'
