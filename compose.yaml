name: promaly

services:
  app:
    image: ${PROMALY_IMAGE:-ghcr.io/promaly/promaly}:${PROMALY_VERSION:?Set PROMALY_VERSION in .env}
    command: ['node', 'apps/api/dist/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://promaly_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/promaly
      MIGRATION_DATABASE_URL: postgres://promaly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/promaly
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${PROMALY_S3_BUCKET:-promaly}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Kept off the host; available only to services on the Compose network.
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 9090
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    ports:
      - '${PROMALY_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/healthz\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  worker:
    image: ${PROMALY_IMAGE:-ghcr.io/promaly/promaly}:${PROMALY_VERSION:?Set PROMALY_VERSION in .env}
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://promaly_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/promaly
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${PROMALY_S3_BUCKET:-promaly}
      S3_REGION: ${S3_REGION:-us-east-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'test -n "$$(find /tmp/promaly-worker.heartbeat -mmin -1 -print -quit)"']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  postgres:
    image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675 # postgres:17
    environment:
      POSTGRES_DB: promaly
      POSTGRES_USER: promaly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init/10-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U promaly -d promaly']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  minio:
    image: minio/minio@sha256:3f97c5651cb6662b880c787a232b6b34fec8d8922e08d6617b25d241a21164bb # RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  migrate:
    image: ${PROMALY_IMAGE:-ghcr.io/promaly/promaly}:${PROMALY_VERSION:?Set PROMALY_VERSION in .env}
    command: ['node', 'packages/db/dist/migrate.js']
    environment:
      MIGRATION_DATABASE_URL: postgres://promaly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/promaly
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  createbuckets:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 # RELEASE.2025-08-13T08-35-41Z
    entrypoint: ['/bin/sh', '-ec']
    command: >-
      mc alias set promaly http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      mc mb --ignore-existing promaly/"$$S3_BUCKET";
      mc anonymous set none promaly/"$$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: ${PROMALY_S3_BUCKET:-promaly}
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'

volumes:
  postgres-data:
  minio-data:
