name: promaly

services:
  app:
    image: ${PROMALY_IMAGE:-ghcr.io/promaly/promaly}:${PROMALY_VERSION:?Set PROMALY_VERSION in .env}
    command: ['node', 'apps/api/dist/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://promaly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/promaly
      S3_ENDPOINT: http://minio:9000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - '${PROMALY_PORT:-3000}:3000'
    restart: unless-stopped

  worker:
    image: ${PROMALY_IMAGE:-ghcr.io/promaly/promaly}:${PROMALY_VERSION:?Set PROMALY_VERSION in .env}
    command: ['node', 'apps/worker/dist/main.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://promaly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/promaly
      S3_ENDPOINT: http://minio:9000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: promaly
      POSTGRES_USER: promaly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U promaly -d promaly']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
