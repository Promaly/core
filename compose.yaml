name: promaly

# Zero-touch deployment: `docker compose up -d` with no .env and no editing.
#
# Internal service credentials (Postgres + MinIO) are generated once by the
# `bootstrap` service into the `promaly-secrets` volume and never leave it — no
# secrets in this file, in `docker inspect`, or in git. The first admin account
# is created through the web UI on first visit.
#
# `.env` is optional and only carries operator choices (public port, SMTP,
# running a released image instead of building). See `.env.example`.

x-promaly-image: &promaly-image
  image: ${PROMALY_IMAGE:-promaly}:${PROMALY_VERSION:-local}
  build:
    context: .
  pull_policy: ${PROMALY_PULL_POLICY:-missing}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  # One-shot: generate internal credentials on first run. Idempotent — existing
  # secrets are never overwritten. Nothing here is operator-facing.
  bootstrap:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 # RELEASE.2025-08-13T08-35-41Z
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        umask 077
        mkdir -p /run/promaly
        for name in db_owner_password db_app_password minio_root_password; do
          f="/run/promaly/$$name"
          [ -s "$$f" ] || head -c 48 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$f"
        done
        chmod 0444 /run/promaly/*
        echo "promaly: internal credentials ready"
    volumes:
      - promaly-secrets:/run/promaly
    restart: 'no'
    logging: *logging

  postgres:
    image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675 # postgres:17
    shm_size: 128mb
    # Read the generated password from the secrets volume and set POSTGRES_PASSWORD
    # directly. `unset POSTGRES_PASSWORD_FILE` so the two are never both present —
    # some hosting platforms auto-inject POSTGRES_PASSWORD for `postgres` images,
    # and the entrypoint refuses to start when it sees both.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export POSTGRES_PASSWORD="$$(cat /run/promaly/db_owner_password)"
        unset POSTGRES_PASSWORD_FILE
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_DB: promaly
      POSTGRES_USER: promaly
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - promaly-secrets:/run/promaly:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U promaly -d promaly']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging

  minio:
    image: minio/minio@sha256:3f97c5651cb6662b880c787a232b6b34fec8d8922e08d6617b25d241a21164bb # RELEASE.2025-04-22T22-12-26Z
    # Same guard as postgres: set MINIO_ROOT_PASSWORD from the secrets volume and
    # drop the _FILE variant so an injected MINIO_ROOT_PASSWORD can't collide.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export MINIO_ROOT_PASSWORD="$$(cat /run/promaly/minio_root_password)"
        unset MINIO_ROOT_PASSWORD_FILE
        exec /usr/bin/docker-entrypoint.sh minio server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: promaly
    volumes:
      - minio-data:/data
      - promaly-secrets:/run/promaly:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  # Creates the least-privilege `promaly_app` role, applies migrations, then
  # exits. The API and worker wait for it. Runs as the database owner and does
  # the role setup itself, so no `docker-entrypoint-initdb.d` bind mount is
  # needed — some platforms (Coolify, Portainer stacks) don't mount repo paths.
  migrate:
    <<: *promaly-image
    command:
      - /bin/sh
      - -ec
      - |
        export MIGRATION_DATABASE_URL="postgres://promaly:$$(cat /run/promaly/db_owner_password)@postgres:5432/promaly"
        export PROMALY_APP_PASSWORD="$$(cat /run/promaly/db_app_password)"
        exec node packages/db/dist/migrate.js
    volumes:
      - promaly-secrets:/run/promaly:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  # Creates the private object-storage bucket, then exits.
  createbuckets:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 # RELEASE.2025-08-13T08-35-41Z
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        mc alias set promaly http://minio:9000 promaly "$$(cat /run/promaly/minio_root_password)"
        mc mb --ignore-existing promaly/"$${PROMALY_S3_BUCKET:-promaly}"
        mc anonymous set none promaly/"$${PROMALY_S3_BUCKET:-promaly}"
    environment:
      PROMALY_S3_BUCKET: ${PROMALY_S3_BUCKET:-promaly}
    volumes:
      - promaly-secrets:/run/promaly:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  app:
    <<: *promaly-image
    command:
      - /bin/sh
      - -ec
      - |
        export DATABASE_URL="postgres://promaly_app:$$(cat /run/promaly/db_app_password)@postgres:5432/promaly"
        exec node apps/api/dist/main.js
    environment:
      NODE_ENV: production
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${PROMALY_S3_BUCKET:-promaly}
      S3_REGION: ${S3_REGION:-us-east-1}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Metrics bind to the Compose network only (never published to the host).
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 9090
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      WORKER_HEALTH_PORT: 8081
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - promaly-secrets:/run/promaly:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    ports:
      - '${PROMALY_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/healthz\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  worker:
    <<: *promaly-image
    command:
      - /bin/sh
      - -ec
      - |
        export DATABASE_URL="postgres://promaly_app:$$(cat /run/promaly/db_app_password)@postgres:5432/promaly"
        exec node apps/worker/dist/main.js
    environment:
      NODE_ENV: production
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${PROMALY_S3_BUCKET:-promaly}
      S3_REGION: ${S3_REGION:-us-east-1}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WORKER_HEALTH_PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - promaly-secrets:/run/promaly:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:8081/healthz\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

volumes:
  postgres-data:
  minio-data:
  promaly-secrets:
